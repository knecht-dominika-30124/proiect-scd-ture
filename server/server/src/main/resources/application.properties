spring.application.name=server

# unde e baza de date; dac? "turasmart" nu exist?, o creeaz? singur
spring.datasource.url=jdbc:mysql://localhost:3306/turasmart?createDatabaseIfNotExist=true
spring.datasource.username=root
# parola st? în secrets.properties, care NU se urc? pe GitHub
spring.config.import=optional:classpath:secrets.properties

# creeaz? ?i actualizeaz? tabelele automat din clasele Java
spring.jpa.hibernate.ddl-auto=update
# afi?eaz? în consol? comenzile SQL generate (util ca s? înve?i)
spring.jpa.show-sql=true

# portul pe care porne?te serverul
server.port=8083

# AI (Ollama, ruleaz? local)
ollama.url=http://localhost:11434
ollama.model=gemma3:4b
ollama.context-size=8192

# trimite mesajele noastre de eroare c?tre frontend
spring.web.error.include-message=always